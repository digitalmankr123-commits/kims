<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>민수 코팅 회원가입</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans KR',sans-serif;}
a{text-decoration:none;}
input{font-family:'Noto Sans KR',sans-serif;}
input::placeholder{color:#B3B3B3;}
</style>
</head>
<body>
<div style="width:100%; min-height:100vh; box-sizing:border-box; background:linear-gradient(180deg,#EAFBFA 0%,#FFFFFF 45%); color:#1A1A1A; display:flex; flex-direction:column; align-items:center;">

  <div style="width:100%; max-width:1200px; padding:32px 40px 0; box-sizing:border-box;">
    <a href="index.html" style="display:inline-flex; align-items:center; gap:10px;">
      <div style="width:40px; height:40px; border-radius:12px; background:#2AC1BC; display:flex; align-items:center; justify-content:center;">
        <span style="font-family:'Jua',sans-serif; font-size:18px; color:#FFFFFF;">민</span>
      </div>
      <span style="font-family:'Jua',sans-serif; font-size:19px; color:#1A1A1A;">민수 코팅</span>
    </a>
  </div>

  <div style="flex:1; width:100%; display:flex; align-items:center; justify-content:center; padding:24px 20px;">
    <div style="width:420px; max-width:100%; background:#FFFFFF; border-radius:24px; padding:40px 36px; box-sizing:border-box; box-shadow:0 20px 50px rgba(22,48,46,0.10); display:flex; flex-direction:column; gap:22px;">

      <div style="display:flex; flex-direction:column; gap:8px; text-align:center;">
        <h1 style="margin:0; font-family:'Jua',sans-serif; font-weight:400; font-size:26px; color:#1A1A1A;">민수 코팅 회원가입</h1>
        <p style="margin:0; font-size:14px; color:#8C8C8C;">가입하고 시공 예약과 혜택을 받아보세요</p>
      </div>

      <form style="display:flex; flex-direction:column; gap:14px;">
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label for="name" style="font-size:13px; font-weight:700; color:#4B4B4B;">이름</label>
          <input id="name" type="text" placeholder="이름을 입력하세요" style="height:46px; border:1px solid #E7E7E7; border-radius:10px; padding:0 14px; font-size:15px; color:#1A1A1A; box-sizing:border-box;">
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label for="su-email" style="font-size:13px; font-weight:700; color:#4B4B4B;">이메일</label>
          <input id="su-email" type="email" placeholder="example@minsu.com" style="height:46px; border:1px solid #E7E7E7; border-radius:10px; padding:0 14px; font-size:15px; color:#1A1A1A; box-sizing:border-box;">
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label for="phone" style="font-size:13px; font-weight:700; color:#4B4B4B;">휴대폰 번호</label>
          <input id="phone" type="tel" placeholder="010-0000-0000" style="height:46px; border:1px solid #E7E7E7; border-radius:10px; padding:0 14px; font-size:15px; color:#1A1A1A; box-sizing:border-box;">
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label for="su-password" style="font-size:13px; font-weight:700; color:#4B4B4B;">비밀번호</label>
          <input id="su-password" type="password" placeholder="영문, 숫자 포함 8자 이상" style="height:46px; border:1px solid #E7E7E7; border-radius:10px; padding:0 14px; font-size:15px; color:#1A1A1A; box-sizing:border-box;">
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label for="su-password2" style="font-size:13px; font-weight:700; color:#4B4B4B;">비밀번호 확인</label>
          <input id="su-password2" type="password" placeholder="비밀번호를 한 번 더 입력하세요" style="height:46px; border:1px solid #E7E7E7; border-radius:10px; padding:0 14px; font-size:15px; color:#1A1A1A; box-sizing:border-box;">
        </div>

        <div style="display:flex; flex-direction:column; gap:10px; padding-top:6px; border-top:1px solid #F0F0F0;">
          <label style="display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; color:#1A1A1A; padding-top:10px;">
            <input type="checkbox" style="width:17px; height:17px; accent-color:#2AC1BC;">
            전체 동의합니다
          </label>
          <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:#4B4B4B;">
            <input type="checkbox" style="width:16px; height:16px; accent-color:#2AC1BC;">
            [필수] 이용약관 동의
          </label>
          <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:#4B4B4B;">
            <input type="checkbox" style="width:16px; height:16px; accent-color:#2AC1BC;">
            [필수] 개인정보 수집 및 이용 동의
          </label>
          <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:#4B4B4B;">
            <input type="checkbox" style="width:16px; height:16px; accent-color:#2AC1BC;">
            [선택] 이벤트 및 혜택 알림 수신 동의
          </label>
        </div>

        <button type="button" style="height:52px; border:none; border-radius:12px; background:#2AC1BC; color:#FFFFFF; font-size:16px; font-weight:700; cursor:pointer; margin-top:4px;">가입하기</button>
      </form>

      <p style="margin:0; text-align:center; font-size:13px; color:#8C8C8C;">이미 계정이 있으신가요? <a href="login.html" style="color:#2AC1BC; font-weight:700;">로그인</a></p>
    </div>
  </div>
</div>
</body>
</html>
