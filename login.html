<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>민수 코팅 로그인</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans KR',sans-serif;}
a{text-decoration:none;}
input{font-family:'Noto Sans KR',sans-serif;}
input::placeholder{color:#B3B3B3;}
</style>
</head>
<body>
<div style="width:100%; min-height:100vh; box-sizing:border-box; background:linear-gradient(180deg,#EAFBFA 0%,#FFFFFF 55%); color:#1A1A1A; display:flex; flex-direction:column; align-items:center;">

  <div style="width:100%; max-width:1200px; padding:32px 40px 0; box-sizing:border-box;">
    <a href="index.html" style="display:inline-flex; align-items:center; gap:10px;">
      <div style="width:40px; height:40px; border-radius:12px; background:#2AC1BC; display:flex; align-items:center; justify-content:center;">
        <span style="font-family:'Jua',sans-serif; font-size:18px; color:#FFFFFF;">민</span>
      </div>
      <span style="font-family:'Jua',sans-serif; font-size:19px; color:#1A1A1A;">민수 코팅</span>
    </a>
  </div>

  <div style="flex:1; width:100%; display:flex; align-items:center; justify-content:center; padding:40px 20px;">
    <div style="width:400px; max-width:100%; background:#FFFFFF; border-radius:24px; padding:44px 36px; box-sizing:border-box; box-shadow:0 20px 50px rgba(22,48,46,0.10); display:flex; flex-direction:column; gap:24px;">

      <div style="display:flex; flex-direction:column; gap:8px; text-align:center;">
        <h1 style="margin:0; font-family:'Jua',sans-serif; font-weight:400; font-size:26px; color:#1A1A1A;">다시 만나서 반가워요</h1>
        <p style="margin:0; font-size:14px; color:#8C8C8C;">민수 코팅 계정으로 로그인하세요</p>
      </div>

      <form style="display:flex; flex-direction:column; gap:16px;">
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label for="email" style="font-size:13px; font-weight:700; color:#4B4B4B;">이메일</label>
          <input id="email" type="email" placeholder="example@minsu.com" style="height:48px; border:1px solid #E7E7E7; border-radius:10px; padding:0 14px; font-size:15px; color:#1A1A1A; box-sizing:border-box;">
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label for="password" style="font-size:13px; font-weight:700; color:#4B4B4B;">비밀번호</label>
          <input id="password" type="password" placeholder="비밀번호를 입력하세요" style="height:48px; border:1px solid #E7E7E7; border-radius:10px; padding:0 14px; font-size:15px; color:#1A1A1A; box-sizing:border-box;">
        </div>

        <div style="display:flex; align-items:center; justify-content:space-between;">
          <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:#4B4B4B;">
            <input type="checkbox" style="width:16px; height:16px; accent-color:#2AC1BC;">
            로그인 상태 유지
          </label>
          <a href="#find" style="font-size:13px; color:#8C8C8C;">비밀번호 찾기</a>
        </div>

        <button type="button" style="height:52px; border:none; border-radius:12px; background:#2AC1BC; color:#FFFFFF; font-size:16px; font-weight:700; cursor:pointer;">로그인</button>
      </form>

      <div style="display:flex; align-items:center; gap:12px;">
        <div style="flex:1; height:1px; background:#EDEDED;"></div>
        <span style="font-size:12px; color:#B3B3B3;">또는</span>
        <div style="flex:1; height:1px; background:#EDEDED;"></div>
      </div>

      <button type="button" style="height:52px; border:none; border-radius:12px; background:#FEE500; color:#1A1A1A; font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#1A1A1A"><path d="M12 3C6.48 3 2 6.48 2 10.8c0 2.76 1.85 5.19 4.64 6.6-.2.75-.74 2.73-.85 3.15-.13.52.19.51.4.37.17-.11 2.66-1.8 3.74-2.53.68.1 1.38.15 2.07.15 5.52 0 10-3.48 10-7.74S17.52 3 12 3z"/></svg>
        카카오로 로그인
      </button>

      <p style="margin:0; text-align:center; font-size:13px; color:#8C8C8C;">아직 회원이 아니신가요? <a href="signup.html" style="color:#2AC1BC; font-weight:700;">회원가입</a></p>
    </div>
  </div>
</div>
</body>
</html>
